name: Bug Report
description: Report a reproducible problem or unexpected behavior in GWM
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a problem with GWM.

        Please provide enough information for us to reproduce and investigate the issue. Before submitting, consider checking existing issues to see whether the problem has already been reported.

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Clearly describe the problem you encountered.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect GWM to do?
      placeholder: Describe the expected behavior or result.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the steps needed to reproduce the problem.
      placeholder: |
        1. Configure GWM with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: GWM version
      description: Provide the GWM release, version, or Git commit hash you are using.
      placeholder: "e.g., v1.0.0 or commit abc1234"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Select the operating system on which GWM is running.
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: If applicable, provide the Python version used to run GWM.
      placeholder: "e.g., Python 3.12.2"

  - type: textarea
    id: configuration
    attributes:
      label: GWM configuration and input
      description: |
        Provide the relevant configuration, input settings, or other information needed to reproduce the problem. Please remove confidential or sensitive information.
      placeholder: Paste the relevant configuration or describe the input here.

  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Paste any relevant error messages, traceback, console output, or logs.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add anything else that may help us investigate, such as screenshots, figures, or observations.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same or a similar problem.
          required: true
        - label: I have removed confidential, sensitive, or personally identifiable information from the material provided.
          required: true

